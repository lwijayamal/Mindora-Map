<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="MINDORA Microbiology Exhibition – Venue Map" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#035b82"/>
      <stop offset="0.55" stop-color="#1e9077"/>
      <stop offset="1" stop-color="#3db54a"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1000" height="260" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="260" fill="url(#bg)"/>

    <!-- floating microbes -->
    <g fill="#fff" fill-opacity=".13" stroke="#fff" stroke-opacity=".35" stroke-width="2">
      <circle cx="90" cy="210" r="38"><animate attributeName="cy" values="210;60;210" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="70" r="22"><animate attributeName="cy" values="70;200;70" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="220" r="30"><animate attributeName="cy" values="220;40;220" dur="11s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="60" r="44"><animate attributeName="cy" values="60;210;60" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="920" cy="190" r="26"><animate attributeName="cy" values="190;50;190" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="130" r="14"><animate attributeName="cx" values="640;700;640" dur="6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- title -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="500" y="125" font-size="84" font-weight="800" fill="#fff" letter-spacing="10" opacity="0">
        MINDORA
        <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
        <animate attributeName="y" from="160" to="125" dur="1.2s" fill="freeze"/>
      </text>
      <text x="500" y="178" font-size="26" font-weight="700" fill="#e8fff0" letter-spacing="8" opacity="0">
        MICROBIOLOGY EXHIBITION
        <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.8s" fill="freeze"/>
      </text>
      <text x="500" y="218" font-size="18" fill="#fff" fill-opacity=".9" opacity="0">
        Interactive Venue Map  ·  Find every lab, hall &amp; facility
        <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.5s" fill="freeze"/>
      </text>
    </g>

    <!-- shine sweep -->
    <rect x="-200" y="0" width="120" height="260" fill="#fff" fill-opacity=".15" transform="skewX(-20)">
      <animate attributeName="x" values="-200;1200" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
